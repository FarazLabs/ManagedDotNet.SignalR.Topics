<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Server to client Handle flow">
  <rect width="1100" height="520" fill="#ffffff"/>
  <defs>
    <style>
      .box { stroke:#222; stroke-width:1.5; }
      .label { font-family:Segoe UI,Arial,sans-serif; font-size:13px; fill:#111; }
      .title { font-family:Segoe UI,Arial,sans-serif; font-size:13px; font-weight:600; fill:#111; text-anchor:middle; }
      .life { stroke:#888; stroke-width:1.5; stroke-dasharray:4 4; }
      .call { stroke:#222; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .ret { stroke:#222; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#arrow); }
      .group { fill:none; stroke:#666; stroke-width:1.5; stroke-dasharray:6 4; }
      .groupTitle { font-family:Segoe UI,Arial,sans-serif; font-size:12px; fill:#444; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- SignalR Topics group -->
  <rect class="group" x="220" y="18" width="640" height="484" rx="4"/>
  <text class="groupTitle" x="235" y="38">SignalR Topics</text>

  <!-- Application Code -->
  <rect class="box" x="30" y="50" width="150" height="40" fill="#f7c6d4" rx="2"/>
  <text class="title" x="105" y="75">Application Code</text>
  <rect class="box" x="30" y="460" width="150" height="40" fill="#f7c6d4" rx="2"/>
  <text class="title" x="105" y="485">Application Code</text>
  <line class="life" x1="105" y1="90" x2="105" y2="460"/>

  <!-- TopicClientProxy -->
  <rect class="box" x="250" y="50" width="150" height="40" fill="#9fd6d2" rx="2"/>
  <text class="title" x="325" y="75">TopicClientProxy</text>
  <rect class="box" x="250" y="460" width="150" height="40" fill="#9fd6d2" rx="2"/>
  <text class="title" x="325" y="485">TopicClientProxy</text>
  <line class="life" x1="325" y1="90" x2="325" y2="460"/>

  <!-- Configuration Store -->
  <rect class="box" x="460" y="50" width="170" height="40" fill="#f3c98b" rx="2"/>
  <text class="title" x="545" y="75">Configuration Store</text>
  <rect class="box" x="460" y="460" width="170" height="40" fill="#f3c98b" rx="2"/>
  <text class="title" x="545" y="485">Configuration Store</text>
  <line class="life" x1="545" y1="90" x2="545" y2="460"/>

  <!-- IClientProxy -->
  <rect class="box" x="690" y="50" width="130" height="40" fill="#9ec3ef" rx="2"/>
  <text class="title" x="755" y="75">IClientProxy</text>
  <rect class="box" x="690" y="460" width="130" height="40" fill="#9ec3ef" rx="2"/>
  <text class="title" x="755" y="485">IClientProxy</text>
  <line class="life" x1="755" y1="90" x2="755" y2="460"/>

  <!-- SignalR Client -->
  <rect class="box" x="910" y="50" width="150" height="40" fill="#b7df9a" rx="2"/>
  <text class="title" x="985" y="75">SignalR Client</text>
  <rect class="box" x="910" y="460" width="150" height="40" fill="#b7df9a" rx="2"/>
  <text class="title" x="985" y="485">SignalR Client</text>
  <line class="life" x1="985" y1="90" x2="985" y2="460"/>

  <!-- 1 -->
  <line class="call" x1="105" y1="120" x2="325" y2="120"/>
  <text class="label" x="115" y="112">1. Clients.xxx.Handle(message)</text>

  <!-- 2 -->
  <line class="call" x1="325" y1="165" x2="545" y2="165"/>
  <text class="label" x="335" y="157">2. Look up topic &amp; serializer for message type</text>

  <!-- 3 -->
  <line class="ret" x1="545" y1="205" x2="325" y2="205"/>
  <text class="label" x="360" y="197">3. Return topic &amp; serializer</text>

  <!-- 4 self -->
  <path class="call" d="M 325 245 C 380 245, 380 275, 325 275"/>
  <text class="label" x="385" y="265">4. Serialize message payload</text>

  <!-- 5 -->
  <line class="call" x1="325" y1="320" x2="755" y2="320"/>
  <text class="label" x="420" y="312">5. Handle(topic, payload)</text>

  <!-- 6 -->
  <line class="call" x1="755" y1="360" x2="985" y2="360"/>
  <text class="label" x="770" y="352">6. SignalR client method invoked</text>

  <!-- 7 -->
  <line class="ret" x1="755" y1="400" x2="325" y2="400"/>
  <text class="label" x="430" y="392">7. Send result (success/failure)</text>

  <!-- 8 -->
  <line class="ret" x1="325" y1="440" x2="105" y2="440"/>
  <text class="label" x="160" y="432">8. Return</text>
</svg>
