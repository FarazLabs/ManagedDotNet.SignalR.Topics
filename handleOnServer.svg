<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Client to server Handle flow">
  <rect width="1100" height="520" fill="#ffffff"/>
  <defs>
    <style>
      .box { stroke:#222; stroke-width:1.5; }
      .label { font-family:Segoe UI,Arial,sans-serif; font-size:13px; fill:#111; }
      .title { font-family:Segoe UI,Arial,sans-serif; font-size:14px; font-weight:600; fill:#111; text-anchor:middle; }
      .life { stroke:#888; stroke-width:1.5; stroke-dasharray:4 4; }
      .call { stroke:#222; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .ret { stroke:#222; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- participants -->
  <rect class="box" x="40" y="30" width="120" height="40" fill="#f7c6d4" rx="2"/>
  <text class="title" x="100" y="55">Client</text>
  <rect class="box" x="40" y="460" width="120" height="40" fill="#f7c6d4" rx="2"/>
  <text class="title" x="100" y="485">Client</text>
  <line class="life" x1="100" y1="70" x2="100" y2="460"/>

  <rect class="box" x="250" y="30" width="120" height="40" fill="#9fd6d2" rx="2"/>
  <text class="title" x="310" y="55">Server</text>
  <rect class="box" x="250" y="460" width="120" height="40" fill="#9fd6d2" rx="2"/>
  <text class="title" x="310" y="485">Server</text>
  <line class="life" x1="310" y1="70" x2="310" y2="460"/>

  <rect class="box" x="450" y="30" width="170" height="40" fill="#f3c98b" rx="2"/>
  <text class="title" x="535" y="55">Configuration Store</text>
  <rect class="box" x="450" y="460" width="170" height="40" fill="#f3c98b" rx="2"/>
  <text class="title" x="535" y="485">Configuration Store</text>
  <line class="life" x1="535" y1="70" x2="535" y2="460"/>

  <rect class="box" x="700" y="30" width="130" height="40" fill="#9ec3ef" rx="2"/>
  <text class="title" x="765" y="55">DI Container</text>
  <rect class="box" x="700" y="460" width="130" height="40" fill="#9ec3ef" rx="2"/>
  <text class="title" x="765" y="485">DI Container</text>
  <line class="life" x1="765" y1="70" x2="765" y2="460"/>

  <rect class="box" x="900" y="30" width="150" height="40" fill="#b7df9a" rx="2"/>
  <text class="title" x="975" y="55">Handler Instance</text>
  <rect class="box" x="900" y="460" width="150" height="40" fill="#b7df9a" rx="2"/>
  <text class="title" x="975" y="485">Handler Instance</text>
  <line class="life" x1="975" y1="70" x2="975" y2="460"/>

  <!-- 1 -->
  <line class="call" x1="100" y1="110" x2="310" y2="110"/>
  <text class="label" x="120" y="102">1. Handle(topic, payload)</text>

  <!-- 2 -->
  <line class="call" x1="310" y1="155" x2="535" y2="155"/>
  <text class="label" x="320" y="147">2. Look up config (deserializer, IHubCommandHandler)</text>

  <!-- 3 -->
  <line class="ret" x1="535" y1="195" x2="310" y2="195"/>
  <text class="label" x="360" y="187">3. Returns details</text>

  <!-- 4 self -->
  <path class="call" d="M 310 235 C 360 235, 360 265, 310 265"/>
  <text class="label" x="365" y="255">4. Deserialize payload into command</text>

  <!-- 5 -->
  <line class="call" x1="310" y1="310" x2="765" y2="310"/>
  <text class="label" x="360" y="302">5. Retrieve handler from DI Container</text>

  <!-- 6 -->
  <line class="ret" x1="765" y1="350" x2="310" y2="350"/>
  <text class="label" x="430" y="342">6. Returns instance</text>

  <!-- 7 -->
  <line class="call" x1="310" y1="395" x2="975" y2="395"/>
  <text class="label" x="420" y="387">7. Invoke Handle(command, HubCallerContext)</text>

  <!-- 8 -->
  <line class="ret" x1="975" y1="435" x2="310" y2="435"/>
  <text class="label" x="560" y="427">8. Processing complete</text>
</svg>
