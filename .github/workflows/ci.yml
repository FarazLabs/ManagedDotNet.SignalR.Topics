name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SignalR.Topics.sln

      - name: Test
        run: dotnet test SignalR.Topics.sln --no-restore --verbosity normal

      - name: Build and pack
        run: |
          dotnet build src/SignalR.Topics.csproj --no-restore --configuration Release
          dotnet pack src/SignalR.Topics.csproj --no-restore --configuration Release --no-build
